<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跨境吴老师 ABA 周交集机会 BI 看板</title><style>
:root{--page:#3a147b;--panel:#9f78bf;--pink:#df5d9c;--text:#fff;--ink:#1a1230;--blue:#1595f9;--yellow:#f4fb20;--line:rgba(255,255,255,.24)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft YaHei",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(255,120,220,.35),transparent 28%),linear-gradient(135deg,#40208b 0%,#801d8e 43%,#e22075 100%)}.dashboard{width:min(1360px,100vw);margin:0 auto;padding:8px}.top{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr;gap:10px}.tile,.panel{border:1.5px solid #13071e;border-radius:13px;box-shadow:0 2px 0 rgba(0,0,0,.22);overflow:hidden}.tile{min-height:104px;background:linear-gradient(145deg,rgba(183,126,193,.94),rgba(224,91,157,.93))}.title{display:flex;align-items:center;padding:0 24px;background:rgba(183,126,193,.95)}h1{margin:0;color:#16121e;font-size:29px;line-height:1.2;font-weight:800}.sub{margin-top:9px;color:#2a1050;font-size:13px;font-weight:700}.week{display:grid;place-content:center;text-align:center;padding:12px}.week .date{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}.week .label{margin-top:8px;font-size:13px}.site{display:grid;place-content:center;text-align:center;padding:12px;background:#704fc5}.site .code{font-size:30px;font-weight:900}.site .label{margin-top:8px;font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px 12px;background:rgba(183,126,193,.86);border:1.5px solid #13071e;border-radius:13px}.toolbar input,.toolbar select{height:34px;border:1px solid rgba(0,0,0,.45);border-radius:7px;padding:0 10px;font:700 13px "Microsoft YaHei",Arial,sans-serif}.toolbar input{min-width:280px;flex:1}.content{display:grid;grid-template-columns:1.65fr .95fr;gap:14px;margin-top:14px}.panel{padding:12px 14px;background:rgba(183,126,193,.86)}.panel.pink{background:rgba(220,96,158,.88)}h2{margin:0 0 10px;text-align:center;font-size:19px}.table-wrap{max-height:610px;overflow:auto;border:1px solid rgba(0,0,0,.35);border-radius:8px}table{width:100%;border-collapse:collapse;table-layout:fixed;background:rgba(255,255,255,.06)}th,td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{position:sticky;top:0;z-index:1;background:rgba(83,39,139,.95);text-align:left}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.active{background:rgba(255,255,255,.16)}.num{text-align:right;font-variant-numeric:tabular-nums}.detail{min-height:215px}.detail-row{padding:9px 0;border-bottom:1px solid var(--line)}.detail-label{font-size:11px;opacity:.8}.detail-value{margin-top:4px;font-size:14px;font-weight:800;line-height:1.4;word-break:break-word}.top10{margin-top:14px}.top10-list{display:grid;gap:7px}.top10-item{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.10);cursor:pointer}.top10-item:hover,.top10-item.active{background:rgba(255,241,168,.24)}.top10-rank{color:#fff1a8;font-weight:900}.top10-word{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800}.top10-multiple{color:#fff1a8;font-weight:900;font-variant-numeric:tabular-nums}.empty{padding:36px 12px;text-align:center;font-weight:800}@media(max-width:980px){.top,.content{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{min-width:0}.table-wrap{max-height:440px}}
</style></head><body><main class="dashboard"><section class="top"><div class="tile title"><div><h1>跨境吴老师 ABA 周交集机会 BI 看板</h1><div class="sub">快速飙升市场与异动市场的英文关键词精确交集</div></div></div><div class="tile site"><div class="code" id="siteCode"></div><div class="label">当前站点</div></div><div class="tile week"><div class="date" id="latestWeek"></div><div class="label">快速飙升市场</div></div><div class="tile week"><div class="date" id="previousWeek"></div><div class="label">异动市场</div></div></section><section class="toolbar"><input id="search" placeholder="搜索英文关键词或中文翻译"><select id="sort"><option value="current">现 ABA 排名升序</option><option value="growth">周搜索增长倍数降序</option><option value="previous">前周异动排名升序</option></select><select id="type"><option value="">全部机会类型</option><option>商品/工具</option><option>图书/内容</option><option>节日/季节</option><option>品牌/专名</option></select></section><section class="content"><section class="panel"><h2>关键词机会明细</h2><div class="table-wrap"><table><thead><tr><th>英文关键词</th><th>中文翻译</th><th class="num">现 ABA 排名</th><th class="num">前周异动排名</th><th class="num">搜索增长倍数</th><th>机会类型</th></tr></thead><tbody id="rows"></tbody></table></div></section><aside><section class="panel pink detail"><h2>关键词详情</h2><div id="detail"></div></section><section class="panel top10"><h2>增长倍数 Top 10</h2><div class="top10-list" id="top10"></div></section></aside></section></main><script>const EMBEDDED_DATA=__ABA_OPPORTUNITY_DATA_JSON__;const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),multi=v=>Number.isFinite(Number(v))?Number(v).toFixed(2)+'×':'—';let selected='';function all(){let a=[...(EMBEDDED_DATA.items||[])],q=$('search').value.trim().toLowerCase(),t=$('type').value,s=$('sort').value;if(q)a=a.filter(x=>String(x.keyword).toLowerCase().includes(q)||String(x.zh).toLowerCase().includes(q));if(t)a=a.filter(x=>x.type===t);a.sort((a,b)=>s==='growth'?Number(b.growthMultiple)-Number(a.growthMultiple)||String(a.keyword).localeCompare(String(b.keyword)):s==='previous'?Number(a.previousWeekAnomalyRank)-Number(b.previousWeekAnomalyRank)||String(a.keyword).localeCompare(String(b.keyword)):Number(a.currentAbaRank)-Number(b.currentAbaRank)||String(a.keyword).localeCompare(String(b.keyword)));return a}function show(x){if(!x){$('detail').innerHTML='<div class="empty">请选择关键词</div>';return}selected=x.keyword;$('detail').innerHTML=[['英文关键词',x.keyword],['中文翻译',x.zh],['当前 ABA 排名',x.currentAbaRank],['前周异动排名',x.previousWeekAnomalyRank],['搜索增长倍数',multi(x.growthMultiple)],['机会类型',x.type]].map(v=>`<div class="detail-row"><div class="detail-label">${v[0]}</div><div class="detail-value">${esc(v[1])}</div></div>`).join('');render()}function render(){const a=all();$('rows').innerHTML=a.length?a.map(x=>`<tr class="${selected===x.keyword?'active':''}" data-k="${esc(x.keyword)}"><td>${esc(x.keyword)}</td><td>${esc(x.zh)}</td><td class="num">${esc(x.currentAbaRank)}</td><td class="num">${esc(x.previousWeekAnomalyRank)}</td><td class="num">${multi(x.growthMultiple)}</td><td>${esc(x.type)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">未找到匹配关键词</td></tr>';$('rows').querySelectorAll('tr[data-k]').forEach(r=>r.onclick=()=>show((EMBEDDED_DATA.items||[]).find(x=>x.keyword===r.dataset.k)));const top=[...(EMBEDDED_DATA.items||[])].sort((a,b)=>Number(b.growthMultiple)-Number(a.growthMultiple)||String(a.keyword).localeCompare(String(b.keyword))).slice(0,10);$('top10').innerHTML=top.map((x,i)=>`<div class="top10-item ${selected===x.keyword?'active':''}" data-k="${esc(x.keyword)}"><div class="top10-rank">${i+1}</div><div class="top10-word">${esc(x.keyword)}</div><div class="top10-multiple">${multi(x.growthMultiple)}</div></div>`).join('')||'<div class="empty">暂无数据</div>';$('top10').querySelectorAll('[data-k]').forEach(r=>r.onclick=()=>show((EMBEDDED_DATA.items||[]).find(x=>x.keyword===r.dataset.k)))}function boot(){$('siteCode').textContent=EMBEDDED_DATA.marketplace||'—';$('latestWeek').textContent=EMBEDDED_DATA.latestWeek||'—';$('previousWeek').textContent=EMBEDDED_DATA.previousWeek||'—';if(EMBEDDED_DATA.status!=='ready'){$('rows').innerHTML=`<tr><td colspan="6" class="empty">${esc(EMBEDDED_DATA.blockReason||'数据不可用')}</td></tr>`;$('detail').innerHTML='<div class="empty">无法生成关键词详情</div>';return}$('search').oninput=render;$('sort').onchange=render;$('type').onchange=render;show((EMBEDDED_DATA.items||[])[0])}boot()</script></body></html>
